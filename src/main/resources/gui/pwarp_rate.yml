title: '&8KaTpa &f评分: &f{pwarp_name}'

Layout:
  - '#########'
  - '##11111##'
  - '#########'
  - '###S#X###'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "1":
    type: 'PWARP_STARS'
    display:
      material: GOLD_NUGGET
      name: '&e{pwarp_star} ★'
    lit-display:
      material: GOLD_INGOT
      name: '&6{pwarp_star} ★'
    unlit-display:
      material: GRAY_DYE
      name: '&7{pwarp_star} ★'
    actions:
      left:
        - 'katpa: pwarp select {pwarp_star}'
  "S":
    display:
      material: LIME_DYE
      name: '&a提交评分'
      lore:
        - '&7当前选择: &f{pwarp_rate_selected} 星'
        - '&e[左键] 提交'
    actions:
      left:
        - 'katpa: pwarp do rate {pwarp_name} {pwarp_rate_selected}'
        - 'close'
  "X":
    display:
      material: BARRIER
      name: '&c取消'
    actions:
      left:
        - 'close'
