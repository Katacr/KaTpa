title: '&8KaTpa &f待处理请求'
update: 20

Layout:
  - '#########'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#<####>#'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "1":
    type: 'REQUEST_LIST'
    display:
      material: PLAYER_HEAD
      skull_owner: '{sender_name}'
      empty_text: '暂无待处理请求'
      name: '&a{sender_name}'
      lore:
        - '&7类型: &f{request_type_display}'
        - '&7剩余: &f{request_remaining}秒'
        - ''
        - '&a[左键] 接受'
        - '&c[右键] 拒绝'
    actions:
      left:
        - 'command: tpaccept {request_id}'
        - 'close'
      right:
        - 'command: tpdeny {request_id}'
        - 'close'
  "<":
    display:
      material: ARROW
      name: '&a上一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page prev'
  ">":
    display:
      material: ARROW
      name: '&a下一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page next'
