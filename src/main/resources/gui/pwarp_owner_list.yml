title: '&8KaTpa &f{owner_name} 的地标'

Layout:
  - '####H####'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '<###B###>'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "H":
    display:
      material: PLAYER_HEAD
      skull_owner: '{owner_name}'
      name: '&a{owner_name}'
      lore:
        - '&7该玩家创建的玩家地标'
  "1":
    type: 'PWARP_OWNER_LIST'
    display:
      material: '{pwarp_icon}'
      custom_data: '{pwarp_custom_data}'
      item_model: '{pwarp_item_model}'
      name: '&a{pwarp_name}'
      lore:
        - '&7创建者: &f{pwarp_owner}'
        - '&7描述: &f{pwarp_description}'
        - '&7费用: &f{pwarp_cost}'
        - '&7评分: &f{pwarp_stars}★ &7({pwarp_score}分)'
        - ''
        - '&a[左键] 传送'
        - '&e[右键] 评分'
        - '&e[Q键] 收藏/取消'
    actions:
      left:
        - 'katpa: pwarp warp {pwarp_name}'
        - 'close'
      right:
        - 'katpa: pwarp rate {pwarp_name}'
      drop:
        - 'katpa: pwarp favorite {pwarp_name}'
  "B":
    display:
      material: ARROW
      name: '&a返回'
      lore:
        - '&e返回玩家筛选列表'
    actions:
      left:
        - 'open: pwarp_players'
  "<":
    display:
      material: ARROW
      name: '&a上一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page prev'
  ">":
    display:
      material: ARROW
      name: '&a下一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page next'
