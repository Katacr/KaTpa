title: '&8KaTpa &f{owner_name} 的地标'

Layout:
  - '#########'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#B#######'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "1":
    type: 'PWARP_OWNER_LIST'
    display:
      material: '{pwarp_icon}'
      custom_data: '{pwarp_custom_data}'
      item_model: '{pwarp_item_model}'
      empty_text: '该玩家还没有创建地标'
      name: '&a{pwarp_name}'
      lore:
        - '&7创建者: &f{pwarp_owner}'
        - '&7描述: &f{pwarp_description}'
        - '&7费用: &f{pwarp_cost}'
        - '&7评分: &f{pwarp_stars}★ &7({pwarp_score}分)'
        - ''
        - '&a[左键] 传送'
        - '&e[Q键] 收藏/取消'
    actions:
      left:
        - 'command: pwarp {pwarp_name}'
        - 'close'
      drop:
        - 'katpa: pwarp favorite {pwarp_name}'
  "B":
    display:
      material: ARROW
      name: '&a返回'
      lore:
        - '&e返回玩家筛选列表'
    actions:
      left:
        - 'open: pwarp_players'
