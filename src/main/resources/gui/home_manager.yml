title: '&8KaTpa &f家管理'

Layout:
  - '########A'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#<####>X'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "1":
    type: 'HOME_LIST'
    display:
      material: RED_BED
      empty_text: '暂无家，点击 A 新建'
      name: '&a{home_name}'
      lore:
        - '&7世界: &f{home_world}'
        - '&7服务器: &f{home_server}'
        - ''
        - '&a[左键] 传送'
        - '&e[右键] 编辑'
    actions:
      left:
        - 'command: home {home_name}'
        - 'close'
      right:
        - 'katpa: home edit {home_name}'
  "A":
    display:
      material: ANVIL
      name: '&a新建家'
      lore:
        - '&7点击后输入家名称'
        - '&e点击创建'
    actions:
      left:
        - 'katpa: home create'
  "X":
    display:
      material: BARRIER
      name: '&c关闭'
    actions:
      left:
        - 'close'
  "<":
    display:
      material: ARROW
      name: '&a上一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page prev'
  ">":
    display:
      material: ARROW
      name: '&a下一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page next'
