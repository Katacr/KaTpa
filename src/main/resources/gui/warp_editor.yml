title: '&8KaTpa &f编辑地标: &f{warp_name}'

Layout:
  - '#########'
  - '#  N P  #'
  - '#  C M  #'
  - '#  D I  #'
  - '####X####'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "N":
    display:
      material: NAME_TAG
      name: '&a名称: &f{warp_name}'
      lore:
        - '&e点击修改名称'
    actions:
      left:
        - 'katpa: warp set name {warp_name}'
  "P":
    display:
      material: BARRIER
      name: '&a权限节点: &f{warp_permission}'
      lore:
        - '&e点击修改权限节点'
    actions:
      left:
        - 'katpa: warp set permission {warp_name}'
  "C":
    display:
      material: CLOCK
      name: '&a冷却: &f{warp_cooldown}秒'
      lore:
        - '&e点击修改冷却时间'
    actions:
      left:
        - 'katpa: warp set cooldown {warp_name}'
  "M":
    display:
      material: EMERALD
      name: '&a费用: &f{warp_cost}'
      lore:
        - '&e点击修改传送费用'
    actions:
      left:
        - 'katpa: warp set cost {warp_name}'
  "D":
    display:
      material: WRITABLE_BOOK
      name: '&a描述: &f{warp_description}'
      lore:
        - '&e点击修改描述'
    actions:
      left:
        - 'katpa: warp set desc {warp_name}'
  "I":
    display:
      material: {warp_icon}
      custom_data: '{warp_custom_data}'
      item_model: '{warp_item_model}'
      name: '&a图标: &f{warp_icon}'
      lore:
        - '&7点击后关闭菜单，手持物品再点聊天栏 [此处]'
        - '&e点击设置'
    actions:
      left:
        - 'katpa: warp icon {warp_name}'
  "X":
    display:
      material: BARRIER
      name: '&c关闭'
    actions:
      left:
        - 'close'
