title: '&8KaTpa &f我的玩家地标'

Layout:
  - '########A'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#<####>X'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "1":
    type: 'PWARP_LIST'
    display:
      material: '{pwarp_icon}'
      custom_data: '{pwarp_custom_data}'
      item_model: '{pwarp_item_model}'
      name: '&a{pwarp_name}'
      lore:
        - '&7描述: &f{pwarp_description}'
        - '&7费用: &f{pwarp_cost}'
        - '&7评分: &f{pwarp_stars}★ &7({pwarp_score}分)'
        - ''
        - '&a[左键] 编辑'
        - '&e[右键] 编辑'
    actions:
      left:
        - 'katpa: pwarp edit {pwarp_name}'
      right:
        - 'katpa: pwarp edit {pwarp_name}'
    # 已解锁但未使用的空槽位（结构与 display/actions 一致）：
    empty-display:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '&7空位 &8(未使用)'
      lore:
        - '&7你还可以创建新的玩家地标'
        - '&e[左键] 创建新地标'
    empty-actions:
      left:
        - 'katpa: pwarp create'
    # 未解锁（权限不足）的锁定槽位（结构与 display/actions 一致）：
    lock-display:
      material: RED_STAINED_GLASS_PANE
      name: '&c未解锁'
      lore:
        - '&7提升权限以解锁更多地标数量'
    lock-actions:
      left:
        - 'tell: &c你的地标数量上限不足，请提升权限后再试。'
  "A":
    display:
      material: ANVIL
      name: '&a新建地标'
      lore:
        - '&7点击后输入地标名称'
        - '&e点击创建'
    actions:
      left:
        - 'katpa: pwarp create'
  "X":
    display:
      material: BARRIER
      name: '&c关闭'
    actions:
      left:
        - 'close'
  "<":
    display:
      material: ARROW
      name: '&a上一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page prev'
  ">":
    display:
      material: ARROW
      name: '&a下一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page next'
