title: '&8KaTpa &f我的玩家地标'

Layout:
  - '########A'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#<####>X'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "1":
    type: 'PWARP_LIST'
    display:
      material: '{pwarp_icon}'
      custom_data: '{pwarp_custom_data}'
      item_model: '{pwarp_item_model}'
      empty_text: '你还没有地标，点击 A 新建'
      name: '&a{pwarp_name}'
      lore:
        - '&7描述: &f{pwarp_description}'
        - '&7费用: &f{pwarp_cost}'
        - '&7评分: &f{pwarp_stars}★ &7({pwarp_score}分)'
        - ''
        - '&a[左键] 编辑'
        - '&e[右键] 编辑'
    actions:
      left:
        - 'katpa: pwarp edit {pwarp_name}'
      right:
        - 'katpa: pwarp edit {pwarp_name}'
  "A":
    display:
      material: ANVIL
      name: '&a新建地标'
      lore:
        - '&7点击后输入地标名称'
        - '&e点击创建'
    actions:
      left:
        - 'katpa: pwarp create'
  "X":
    display:
      material: BARRIER
      name: '&c关闭'
    actions:
      left:
        - 'close'
  "<":
    display:
      material: ARROW
      name: '&a上一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page prev'
  ">":
    display:
      material: ARROW
      name: '&a下一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page next'
