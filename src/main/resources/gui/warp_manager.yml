title: '&8KaTpa &f地标管理'

Layout:
  - '########A'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#<####>X'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "1":
    type: 'WARP_LIST'
    display:
      material: '{warp_icon}'
      custom_data: '{warp_custom_data}'
      item_model: '{warp_item_model}'
      name: '&a{warp_name}'
      lore:
        - '&7世界: &f{warp_world}'
        - '&7服务器: &f{warp_server}'
        - '&7冷却: &f{warp_cooldown}秒'
        - '&7费用: &f{warp_cost}'
        - '&7描述: &f{warp_description}'
        - ''
        - '&a[左键] 编辑'
        - '&e[右键] 编辑'
    actions:
      left:
        - 'katpa: warp edit {warp_name}'
      right:
        - 'katpa: warp edit {warp_name}'
    # 列表未使用槽位的展示物品（可选，结构与 display 一致；取消注释启用）：
    # empty-display:
    #   material: LIGHT_GRAY_STAINED_GLASS_PANE
    #   name: '&8空位'
    # 列表未使用槽位被点击时的动作（可选，结构与 actions 一致）：
    # empty-actions:
    #   left:
    #     - 'tell: &7这是空槽位'
  "A":
    display:
      material: ANVIL
      name: '&a新建地标'
      lore:
        - '&7点击后输入地标名称'
        - '&e点击创建'
    actions:
      left:
        - 'katpa: warp create'
  "X":
    display:
      material: BARRIER
      name: '&c关闭'
    actions:
      left:
        - 'close'
  "<":
    display:
      material: ARROW
      name: '&a上一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page prev'
  ">":
    display:
      material: ARROW
      name: '&a下一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page next'
