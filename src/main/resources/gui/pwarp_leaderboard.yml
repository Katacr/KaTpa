title: '&8KaTpa &f玩家地标排行榜'

Layout:
  - '#########'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#B#######'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "1":
    type: 'PWARP_LEADERBOARD'
    display:
      material: '{pwarp_icon}'
      custom_data: '{pwarp_custom_data}'
      item_model: '{pwarp_item_model}'
      empty_text: '暂无排行数据'
      name: '&a#{pwarp_rank} {pwarp_name}'
      lore:
        - '&7创建者: &f{pwarp_owner}'
        - '&7描述: &f{pwarp_description}'
        - '&7评分: &f{pwarp_stars}★ &7({pwarp_score}分)'
        - '&7传送费用: &f{pwarp_cost}'
        - ''
        - '&a[左键] 传送'
        - '&e[右键] 评分'
    actions:
      left:
        - 'command: pwarp {pwarp_name}'
        - 'close'
      right:
        - 'katpa: pwarp rate {pwarp_name}'
  "B":
    display:
      material: ARROW
      name: '&a返回'
      lore:
        - '&e返回玩家地标列表'
    actions:
      left:
        - 'open: pwarp_selector'
