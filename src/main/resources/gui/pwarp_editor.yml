title: '&8KaTpa &f编辑玩家地标: &f{pwarp_name}'

Layout:
  - '#########'
  - '#  N D  #'
  - '#  U F  #'
  - '#  I X  #'
  - '#R#####Q#'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "N":
    display:
      material: NAME_TAG
      name: '&a名称: &f{pwarp_name}'
      lore:
        - '&e点击修改名称'
    actions:
      left:
        - 'katpa: pwarp set name {pwarp_name}'
  "D":
    display:
      material: WRITABLE_BOOK
      name: '&a描述: &f{pwarp_description}'
      lore:
        - '&e点击修改描述'
    actions:
      left:
        - 'katpa: pwarp set desc {pwarp_name}'
  "U":
    display:
      material: ENDER_PEARL
      name: '&a更新位置'
      lore:
        - '&7将地标位置更新为你当前所在位置'
        - '&e点击更新'
    actions:
      left:
        - 'katpa: pwarp update {pwarp_name}'
  "F":
    display:
      material: EMERALD
      name: '&a费用: &f{pwarp_cost}'
      lore:
        - '&e点击修改传送费用'
    actions:
      left:
        - 'katpa: pwarp set cost {pwarp_name}'
  "I":
    display:
      material: {pwarp_icon}
      custom_data: '{pwarp_custom_data}'
      item_model: '{pwarp_item_model}'
      name: '&a图标: &f{pwarp_icon}'
      lore:
        - '&7点击后关闭菜单，手持物品再点聊天栏 [此处]'
        - '&e点击设置'
    actions:
      left:
        - 'katpa: pwarp icon {pwarp_name}'
  "R":
    display:
      material: TNT
      name: '&c删除地标'
      lore:
        - '&7删除你自己创建的玩家地标 &f{pwarp_name}'
        - '&c此操作不可撤销'
        - '&e[左键] 删除'
    actions:
      left:
        - 'katpa: pwarp delete {pwarp_name}'
  "Q":
    permission: 'katpa.pwarp.admin'
    display:
      material: BARRIER
      name: '&4管理员强行删除'
      lore:
        - '&7强制删除玩家地标 &f{pwarp_name}'
        - '&c无视创建者，此操作不可撤销'
        - '&e[左键] 强行删除'
    actions:
      left:
        - 'katpa: pwarp delete {pwarp_name}'
  "X":
    display:
      material: BARRIER
      name: '&c关闭'
    actions:
      left:
        - 'close'
