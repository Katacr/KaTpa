title: '&8KaTpa &f编辑玩家地标: &f{pwarp_name}'

Layout:
  - '#########'
  - '#  N D  #'
  - '#  C F  #'
  - '#  I X  #'
  - '####X####'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "N":
    display:
      material: NAME_TAG
      name: '&a名称: &f{pwarp_name}'
      lore:
        - '&e点击修改名称'
    actions:
      left:
        - 'katpa: pwarp set name {pwarp_name}'
  "D":
    display:
      material: WRITABLE_BOOK
      name: '&a描述: &f{pwarp_description}'
      lore:
        - '&e点击修改描述'
    actions:
      left:
        - 'katpa: pwarp set desc {pwarp_name}'
  "C":
    display:
      material: CLOCK
      name: '&a冷却: &f{pwarp_cooldown}秒'
      lore:
        - '&e点击修改冷却时间'
    actions:
      left:
        - 'katpa: pwarp set cooldown {pwarp_name}'
  "F":
    display:
      material: EMERALD
      name: '&a费用: &f{pwarp_cost}'
      lore:
        - '&e点击修改传送费用'
    actions:
      left:
        - 'katpa: pwarp set cost {pwarp_name}'
  "I":
    display:
      material: {pwarp_icon}
      custom_data: '{pwarp_custom_data}'
      item_model: '{pwarp_item_model}'
      name: '&a图标: &f{pwarp_icon}'
      lore:
        - '&7手持物品点击设置图标'
        - '&e点击设置'
    actions:
      left:
        - 'katpa: pwarp icon {pwarp_name}'
  "X":
    display:
      material: BARRIER
      name: '&c关闭'
    actions:
      left:
        - 'close'
