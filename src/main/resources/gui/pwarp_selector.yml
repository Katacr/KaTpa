title: '&8KaTpa &f玩家地标'

Layout:
  - '#########'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#1111111#'
  - '#BH#P#F#L'

button:
  "#":
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
  "1":
    type: 'PWARP_LIST'
    display:
      material: '{pwarp_icon}'
      custom_data: '{pwarp_custom_data}'
      item_model: '{pwarp_item_model}'
      empty_text: '暂无玩家地标'
      name: '&a{pwarp_name}'
      lore:
        - '&7创建者: &f{pwarp_owner}'
        - '&7描述: &f{pwarp_description}'
        - '&7费用: &f{pwarp_cost}'
        - '&7评分: &f{pwarp_stars}★ &7({pwarp_score}分)'
        - ''
        - '&a[左键] 传送'
        - '&e[Q键] 收藏/取消'
    actions:
      left:
        - 'command: pwarp {pwarp_name}'
        - 'close'
      drop:
        - 'katpa: pwarp favorite {pwarp_name}'
  "B":
    display:
      material: ANVIL
      name: '&a我的地标'
      lore:
        - '&7查看和管理你创建的地标'
        - '&e点击管理'
    actions:
      left:
        - 'open: pwarp_manager'
  "H":
    display:
      material: CLOCK
      name: '&a历史传送'
      lore:
        - '&7查看你曾经传送过的玩家地标'
        - '&e点击查看'
    actions:
      left:
        - 'open: pwarp_history'
  "P":
    display:
      material: PLAYER_HEAD
      skull_owner: '{player_name}'
      name: '&a玩家筛选'
      lore:
        - '&7按创建者筛选玩家地标'
        - '&e点击筛选'
    actions:
      left:
        - 'open: pwarp_players'
  "F":
    display:
      material: NETHER_STAR
      name: '&a我的收藏'
      lore:
        - '&7查看你收藏的玩家地标'
        - '&e点击查看'
    actions:
      left:
        - 'open: pwarp_favorites'
  "L":
    display:
      material: NETHER_STAR
      name: '&a排行榜'
      lore:
        - '&7查看评分最高的前十地标'
        - '&e点击查看'
    actions:
      left:
        - 'open: pwarp_leaderboard'
  "<":
    display:
      material: ARROW
      name: '&a上一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page prev'
  ">":
    display:
      material: ARROW
      name: '&a下一页 &7({page}/{total_pages})'
    actions:
      left:
        - 'katpa: page next'
