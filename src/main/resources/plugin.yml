name: KaTpa
version: '${version}'
main: org.katacr.katpa.KaTpaPlugin
api-version: '1.21'
description: 玩家传送请求、邀请与偏好管理
authors: [katacr]

commands:
  katap:
    description: KaTpa 主命令
    usage: /katap <help|reload>
  tpa:
    description: 请求传送到另一名玩家的位置
    usage: /tpa [玩家名]
    permission: katpa.use
  tpahere:
    description: 邀请另一名玩家传送到你的位置
    usage: /tpahere [玩家名]
    permission: katpa.use
  tpaccept:
    description: 接受当前传送请求
    usage: /tpaccept
    aliases: [tpaaccept]
    permission: katpa.use
  tpdeny:
    description: 拒绝当前传送请求
    usage: /tpdeny
    aliases: [tpadeny]
    permission: katpa.use
  tpacancel:
    description: 撤销自己发出的传送请求
    usage: /tpacancel
    permission: katpa.use
  tpasetting:
    description: 打开传送偏好设置
    usage: /tpasetting
    aliases: [tpasettings]
    permission: katpa.setting
  back:
    description: 返回上次位置
    usage: /back
    permission: katpa.back
  dback:
    description: 返回死亡位置
    usage: /dback [序号]
    permission: katpa.dback
  warp:
    description: 传送到地标
    usage: /warp [名称]
    permission: katpa.warp
  setwarp:
    description: 创建或更新地标
    usage: /setwarp [名称]
    permission: katpa.warp.admin
  delwarp:
    description: 删除地标
    usage: /delwarp [名称]
    permission: katpa.warp.admin
  home:
    description: 传送到个人家
    usage: /home [名称]
    permission: katpa.home
  sethome:
    description: 创建或更新个人家
    usage: /sethome [名称]
    permission: katpa.home
  delhome:
    description: 删除个人家
    usage: /delhome [名称]
    permission: katpa.home

permissions:
  katpa.use:
    description: 允许发起和处理传送请求
    default: true
  katpa.setting:
    description: 允许修改自己的传送偏好
    default: true
  katpa.admin:
    description: 允许重载 KaTpa 配置
    default: op
  katpa.cooldown.bypass:
    description: 允许绕过传送请求冷却
    default: op
  katpa.back:
    description: 允许使用 /back 返回上次位置
    default: true
  katpa.dback:
    description: 允许使用 /dback 返回死亡位置
    default: true
  katpa.warp:
    description: 允许使用 /warp 传送到地标
    default: true
  katpa.warp.admin:
    description: 允许使用 /setwarp 和 /delwarp 管理地标
    default: op
  katpa.home:
    description: 允许使用 /home、/sethome 和 /delhome 管理个人家
    default: true
